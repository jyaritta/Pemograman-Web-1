<html>
    <head>
        <style>
            a:link{
                color: #000;
                background-color: transparent;
                text-decoration: none;
            }
            a:visited{
                color: #000;
                background-color: transparent;
                text-decoration: none;
            }
            a:active{
                color: #000;
                background-color: transparent;
                text-decoration: underline;
            }
        </style>
        <title>Mengubah Warna Link</title>
    </head>
    <body>
        <p>Perubahan Style</p>
        Ini adalah <a href="latihan 1.html" target="_blank">link ke halaman lain.</a>

</html>
